name: get_past

on:
  schedule:
    - cron: "22 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: Sleep one minutes
        run: sleep 60
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Rust stable version
        run: rustup update stable

      - name: Rust release build
        run: cargo build --release

      - name: Rust run
        run: cargo run -- past --release

      - name: Deploy JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          V3FILES=$(
            {
              git ls-files -m -- 'docs/v3'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v3' 
              git ls-files --others --exclude-standard -- 'docs/v3'
            }  | sort -u
          )

          V1FILES=$(
            {
              git ls-files -m -- 'docs/v1' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v1' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v1' | grep '\.json$'
            }  | sort -u
          )
          FILES="$V3FILES"$'\n'"$V1FILES"

          if [ -z "$FILES" ]; then
            echo "No JSON changes in docs/v3 to commit."
            exit 0
          fi

          git pull --rebase --autostash

          echo "$FILES" | xargs -d '\n' git add --

          git commit -m "chore: deploy JSON files to docs/v3 [skip ci]" || {
            echo "Nothing to commit."
            exit 0
          }

          git push origin HEAD || (git pull --rebase --autostash && git push origin HEAD)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch Workflow
        uses: lasith-kg/dispatch-workflow@v3.0.0
        with:
          dispatch-method: workflow_dispatch
          repo: BoatraceOpenAPIhub
          owner: lamrongol
          ref: gh-pages
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # GitHub Token With Relevant Permissions
